services:
  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    container_name: inference-service
    networks:
      - ml-net
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    environment:
      - CHECKPOINT_PATH=checkpoints/best_model.pth
      - NUM_CLASSES=100
      - DATASET=cifar100
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ml-gateway
    ports:
      - "8080:8080"
    networks:
      - ml-net
    environment:
      - INFERENCE_URL=http://inference-service:8000
      - MAX_UPLOAD_MB=10
      - PORT=8080
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

networks:
  ml-net:
    driver: bridge
