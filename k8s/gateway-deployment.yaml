apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ml-inference
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ml-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: INFERENCE_URL
              value: "http://inference-service.ml-inference.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
